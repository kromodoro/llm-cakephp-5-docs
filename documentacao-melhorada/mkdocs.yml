site_name: CakePHP 5.2 - Documentação em Português (Brasil)
site_description: Documentação completa do CakePHP 5.2 traduzida e expandida para Português do Brasil
site_author: Traduzido com Claude Code
site_url: https://cakephp-pt-br.readthedocs.io/

# Repository
repo_name: cakephp/cakephp
repo_url: https://github.com/cakephp/cakephp

# Copyright
copyright: Copyright &copy; 2025 CakePHP Foundation - Tradução PT-BR

# Theme Configuration
theme:
  name: material
  language: pt-BR
  palette:
    primary: red
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

# Extensions
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html

# Plugins (simples)
plugins:
  - search

# Extra CSS
extra_css:
  - css/extra.css

# Navigation
nav:
  - Início:
    - Bem-vindo: index.md
    - Guia Rápido: quickstart.md
    - Onde Buscar Ajuda: where-to-get-help.md

  - Introdução:
    - Sobre o CakePHP: intro.md
    - Instalação: installation.md
    - Convenções: conventions.md
    - Estrutura de Pastas: cakephp-folder-structure.md

  - Tutoriais:
    - Visão Geral: tutorials-and-examples.md
    - Tutorial CMS:
      - 1. Instalação: cms-installation.md
      - 2. Banco de Dados: cms-database.md
      - 3. Articles Model: cms-articles-model.md
      - 4. Articles Controller: cms-articles-controller.md
      - 5. Tags e Users: cms-tags-and-users.md
      - 6. Autenticação: cms-authentication.md
      - 7. Autorização: cms-authorization.md

  - Controllers:
    - Introdução: controllers.md
    - Request & Response: controllers-request-response.md
    - Middleware: controllers-middleware.md
    - Components: controllers-components.md
    - Paginação: controllers-pagination.md
    - PagesController: controllers-pages-controller.md

  - Views:
    - Introdução: views.md
    # - Helpers: views-helpers.md
    # - Cells: views-cells.md
    # - Themes: views-themes.md
    # - JSON & XML: views-json-and-xml-views.md

  - Core Libraries:
    - Hash: hash.md
    - Inflector: inflector.md
    - Number: number.md
    - HttpClient: httpclient.md
    - Registry Objects: registry-objects.md
    - Constantes e Funções Globais: global-constants-and-functions.md

  - Internacionalização:
    - I18n & L10n: internationalization-and-localization.md

  - Segurança:
    - Security: security.md

  - Logging:
    - Logging: logging.md

  - Plugins:
    - Plugins: plugin.md

  # - ORM:
  #   - Introdução: orm.md
